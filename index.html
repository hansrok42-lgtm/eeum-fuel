<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>이음 파트너스 | 라이더 편의정보</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;border-radius:22px;padding:22px}.hero small{opacity:.7}.hero h1{margin:5px 0;font-size:24px}.hero p{margin:0;opacity:.75;font-size:13px}.tabs,.row,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:12px 0}.tabs button{flex:1}.ctrl,.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0}button,select{border:1px solid #e5e7eb;background:#fff;padding:11px;border-radius:12px;font-weight:800}button.on{background:#111827;color:#fff}.primary{background:#16a34a;color:#fff}.status,.addr,.note{font-size:12px;color:#6b7280;line-height:1.6}.name{font-size:17px;font-weight:900}.price{font-size:22px;font-weight:1000}.top{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:5px 8px;margin:5px 4px 0 0;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.distance{font-weight:900;color:#166534;margin-top:6px}.actions{margin-top:10px}.actions a{flex:1;text-align:center;padding:10px;border:1px solid #e5e7eb;border-radius:11px;text-decoration:none;color:#111827;font-size:13px;font-weight:800}.call{background:#2563eb!important;color:#fff!important}.hide{display:none!important}.empty{text-align:center;background:#fff;padding:28px;border-radius:18px;color:#6b7280}.foot{text-align:center;color:#9ca3af;font-size:11px;line-height:1.5;margin-top:18px}</style></head><body><div class="w"><div class="hero"><small>이음 파트너스</small><h1 id="title">⛽ 서울 최저가 주유소</h1><p id="sub">오피넷 가격정보 기준 · 라이더용 빠른 검색</p></div><div class="tabs"><button id="fuelTab" class="on">⛽ 주유소</button><button id="repairTab">🔧 정비센터</button><button id="restTab">🚻 화장실·쉼터</button></div>
<section id="fuelView"><div class="ctrl"><div class="row" id="areas"><button class="on" data-a="both">용산+마포+서대문</button><button data-a="yongsan">용산구</button><button data-a="mapo">마포구</button><button data-a="seodaemun">서대문구</button><button data-a="seoul">서울전역</button></div><div class="row" style="margin-top:8px"><select id="fuel"><option value="B027">휘발유</option><option value="D047">경유</option><option value="B034">고급휘발유</option></select><button id="refresh">↻ 최신가격</button></div><div class="row" style="margin-top:8px"><button id="priceSort" class="on">💰 가격순</button><button id="nearSort">📍 가까운순</button><button id="allDaySort">🌙 24시간</button></div><div id="status" class="status">불러오는 중...</div></div><main id="list"></main><div class="foot">한국석유공사 오피넷 Open API 가격정보<br>실제 판매가격과 차이가 있을 수 있습니다.</div></section>
<section id="repairView" class="hide"><div class="ctrl"><b>🛵 라이더 정비센터</b></div><main id="repairList"></main></section>
<section id="restView" class="hide"><div class="ctrl"><b>🚻 개방·공중화장실 / 이동노동자 쉼터</b><div class="note">배달 중 급할 때 바로 찾을 수 있도록 화장실을 우선 표시합니다.</div><div class="row" style="margin-top:9px"><button id="restDefault" class="on">🚻 전체</button><button id="restNear" class="primary">📍 내 위치 가까운순</button></div><div id="restStatus" class="status">용산·마포 중심 등록 화장실</div></div><main id="restList"></main><div class="foot">개방시간은 현장 사정에 따라 달라질 수 있습니다. 늦은 시간에는 상시·24시간 표시 장소를 우선 확인해주세요.</div></section></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let area='both',mode='price';
const repairs=[{name:'명진종합오토바이',district:'마포구',address:'서울 마포구 만리재로 132-2',phone:'010-8542-6551'},{name:'퇴계로모터스',district:'용산구',address:'서울 용산구 원효로1가 45-5',phone:'02-3273-8444'},{name:'DM BIKE',district:'마포구',address:'서울 마포구 월드컵북로 49, 101호',phone:''}];
const rests=[
{name:'용산 이동노동자쉼터',type:'shelter',district:'용산구',address:'서울 용산구 원효로97길 30, 2층',tags:['🛵 이동노동자 쉼터','🪑 휴식']},
{name:'이태원1 공중화장실',district:'용산구',address:'서울 용산구 녹사평대로40길 56',lat:37.5346,lng:126.9910,tags:['🚻 공중화장실','📍 이태원']},{name:'이태원2 공중화장실',district:'용산구',address:'서울 용산구 소월로38가길 8',lat:37.5390,lng:126.9900,tags:['🚻 공중화장실','🌙 상시','📍 이태원']},{name:'이태원 어린이공원 화장실',district:'용산구',address:'서울 용산구 이태원동 287-1',lat:37.5351,lng:126.9950,tags:['🚻 공중화장실','🌙 상시']},{name:'삼각지공원 공중화장실',district:'용산구',address:'서울 용산구 용산동3가 1-96',lat:37.5340,lng:126.9730,tags:['🚻 공중화장실','📍 삼각지']},{name:'신계동 공중화장실',district:'용산구',address:'서울 용산구 신계동 29-4',lat:37.5357,lng:126.9672,tags:['🚻 공중화장실']},{name:'늘푸른공원 공중화장실',district:'용산구',address:'서울 용산구 원효로3가 1-139',lat:37.5345,lng:126.9568,tags:['🚻 공중화장실','🪑 공원']},{name:'청파공원 공중화장실',district:'용산구',address:'서울 용산구 서계동 226-3',lat:37.5528,lng:126.9670,tags:['🚻 공중화장실','🪑 공원']},
{name:'공덕2 공중화장실',district:'마포구',address:'서울 마포구 공덕동 445-2',lat:37.5446,lng:126.9510,tags:['🚻 공중화장실','📍 공덕']},{name:'복사꽃 공중화장실',district:'마포구',address:'서울 마포구 마포대로4길 11-2',lat:37.5374,lng:126.9455,tags:['🚻 공중화장실']},{name:'홍익 공중화장실',district:'마포구',address:'서울 마포구 서교동 359',lat:37.5515,lng:126.9235,tags:['🚻 공중화장실','🌙 24시간','📍 홍대']},{name:'도화소 공중화장실',district:'마포구',address:'서울 마포구 도화동 538',lat:37.5390,lng:126.9470,tags:['🚻 공중화장실']},{name:'노고산1 공중화장실',district:'마포구',address:'서울 마포구 노고산동 24-4',lat:37.5557,lng:126.9380,tags:['🚻 공중화장실','📍 신촌']},{name:'만리 공중화장실',district:'마포구',address:'서울 마포구 아현동 386-72',lat:37.5530,lng:126.9560,tags:['🚻 공중화장실','📍 아현']}
];
function maps(x){let q=encodeURIComponent(x.name+' '+x.address);return `<div class="actions"><a target="_blank" href="https://map.naver.com/p/search/${q}">네이버지도</a><a target="_blank" href="https://map.kakao.com/link/search/${q}">카카오맵</a></div>`}function dist(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,A=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A))}function dtext(k){return k<1?Math.round(k*1000)+'m':k.toFixed(1)+'km'}
function renderRests(data=rests){$('#restList').innerHTML=data.map(x=>`<article class="card"><div class="status">${esc(x.district)} · ${x.type==='shelter'?'이동노동자 쉼터':'화장실'}</div><div class="name">${esc(x.name)}</div>${x.distance!=null?`<div class="distance">📍 현재 위치에서 약 ${dtext(x.distance)}</div>`:''}<div class="addr">${esc(x.address)}</div><div>${(x.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div>${maps(x)}</article>`).join('')}
$('#restNear').onclick=()=>{if(!navigator.geolocation){$('#restStatus').textContent='이 기기에서는 위치 기능을 사용할 수 없습니다.';return}$('#restStatus').textContent='📍 현재 위치 확인 중...';navigator.geolocation.getCurrentPosition(p=>{let a=p.coords.latitude,b=p.coords.longitude;let d=rests.map(x=>({...x,distance:(x.lat&&x.lng)?dist(a,b,x.lat,x.lng):9999})).sort((x,y)=>x.distance-y.distance);renderRests(d);$('#restStatus').textContent='📍 현재 위치에서 가까운 순 · 위치가 확인된 화장실 우선';$('#restNear').classList.add('on');$('#restDefault').classList.remove('on')},()=>$('#restStatus').textContent='위치 권한을 허용하면 가까운 화장실부터 보여드립니다.',{enableHighAccuracy:true,timeout:10000})};$('#restDefault').onclick=()=>{renderRests();$('#restDefault').classList.add('on');$('#restNear').classList.remove('on');$('#restStatus').textContent='용산·마포 중심 등록 화장실'};
function tab(v,t,title,sub){['#fuelView','#repairView','#restView'].forEach(x=>$(x).classList.add('hide'));['#fuelTab','#repairTab','#restTab'].forEach(x=>$(x).classList.remove('on'));$(v).classList.remove('hide');$(t).classList.add('on');$('#title').textContent=title;$('#sub').textContent=sub}$('#fuelTab').onclick=()=>tab('#fuelView','#fuelTab','⛽ 서울 최저가 주유소','오피넷 가격정보 기준 · 라이더용 빠른 검색');$('#repairTab').onclick=()=>{tab('#repairView','#repairTab','🔧 용산·마포 오토바이 정비센터','라이더가 실제 방문 가능한 정비센터 위주');$('#repairList').innerHTML=repairs.map(x=>`<article class="card"><div class="status">${x.district}</div><div class="name">${x.name}</div><div class="addr">${x.address}<br>☎️ ${x.phone||'전화번호 확인 필요'}</div>${maps(x)}</article>`).join('')};$('#restTab').onclick=()=>{tab('#restView','#restTab','🚻 가까운 화장실','배달 중 급할 때 GPS로 가까운 화장실 찾기');renderRests()};
async function load(){mode='price';let u=area==='both'?'/api/stations?areas=yongsan,mapo,seodaemun&prodcd='+$('#fuel').value:'/api/stations?area='+area+'&prodcd='+$('#fuel').value;await fuelLoad(u,'💰 가격순')}async function fuelLoad(u,label){$('#status').textContent='불러오는 중...';try{let j=await fetch(u).then(r=>r.json()),d=j.stations||[];$('#status').textContent=label+' · '+d.length+'곳';$('#list').innerHTML=d.length?d.map((x,i)=>`<article class="card"><div class="top"><div><div class="status">${i+1}위 · ${esc(x.district||'')}</div><div class="name">${esc(x.name)}</div></div><div class="price">${Number(x.price)>0?Number(x.price).toLocaleString()+'원':'가격 확인'}</div></div>${x.distance!=null?`<div class="distance">📍 ${Number(x.distance)>=1000?(Number(x.distance)/1000).toFixed(1)+'km':Math.round(Number(x.distance))+'m'}</div>`:''}<div class="addr">${esc(x.address||'주소 확인 중')}</div>${maps(x)}</article>`).join(''):'<div class="empty">표시할 주유소가 없습니다.</div>'}catch(e){$('#status').textContent='정보를 불러오지 못했습니다.'}}$('#refresh').onclick=load;$('#fuel').onchange=()=>mode==='24'?all24():mode==='near'?nearFuel():load();$('#priceSort').onclick=load;$('#areas').onclick=e=>{let b=e.target.closest('button');if(!b)return;area=b.dataset.a;$('#areas').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));load()};function nearFuel(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{mode='near';fuelLoad(`/api/stations?mode=near&x=${p.coords.longitude}&y=${p.coords.latitude}&prodcd=${$('#fuel').value}`,'📍 가까운순')})}$('#nearSort').onclick=nearFuel;function all24(){mode='24';fuelLoad('/api/stations?mode=24h&prodcd='+$('#fuel').value,'🌙 24시간 운영 확인')}$('#allDaySort').onclick=all24;renderRests();load();
</script></body></html>
