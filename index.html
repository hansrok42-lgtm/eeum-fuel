<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>이음 파트너스 | 라이더 편의정보</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#111827;color:white;border-radius:22px;padding:22px}.hero small{opacity:.7}.hero h1{margin:5px 0;font-size:24px}.hero p{margin:0;opacity:.75;font-size:13px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;font-size:15px}.ctrl{background:white;margin:12px 0;padding:13px;border-radius:18px}.row{display:flex;gap:7px;flex-wrap:wrap}.row+.row{margin-top:9px}button,select{border:1px solid #e5e7eb;background:white;padding:11px;border-radius:12px;font-weight:800}button.on{background:#111827;color:white}#refresh{background:#2563eb;color:white;flex:1}.status{font-size:12px;color:#6b7280;margin-top:9px}.card{background:white;border-radius:18px;padding:15px;margin:9px 0}.best{outline:2px solid #10b981}.top{display:flex;justify-content:space-between;gap:10px}.rank,.tag{font-size:12px;color:#6b7280}.name{font-weight:900;font-size:17px}.price{font-size:23px;font-weight:1000;white-space:nowrap}.price small{font-size:11px;color:#6b7280}.best .price{color:#059669}.addr{font-size:13px;color:#6b7280;margin-top:7px;line-height:1.5}.actions{display:flex;gap:7px;margin-top:11px}.actions a{flex:1;text-align:center;padding:10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:11px;text-decoration:none;color:#111827;font-size:13px;font-weight:800}.actions .call{background:#2563eb;color:white}.empty{text-align:center;background:white;padding:30px;border-radius:18px;color:#6b7280}.foot{text-align:center;color:#9ca3af;font-size:11px;margin-top:18px;line-height:1.5}.hide{display:none}.notice{font-size:12px;color:#6b7280;line-height:1.5}</style></head><body><div class="w"><div class="hero"><small>이음 파트너스</small><h1 id="heroTitle">⛽ 용산·마포 최저가 주유소</h1><p id="heroSub">오피넷 가격정보 기준 · 라이더용 빠른 검색</p></div><div class="tabs"><button id="fuelTab" class="on">⛽ 최저가 주유소</button><button id="repairTab">🔧 오토바이 정비센터</button></div><section id="fuelView"><div class="ctrl"><div class="row" id="areas"><button class="on" data-a="both">용산+마포</button><button data-a="yongsan">용산구</button><button data-a="mapo">마포구</button></div><div class="row"><select id="fuel"><option value="B027">휘발유</option><option value="D047">경유</option><option value="B034">고급휘발유</option></select><button id="refresh">↻ 최신가격</button></div><div id="status" class="status">불러오는 중...</div></div><main id="list"><div class="empty">가격정보를 불러오고 있습니다.</div></main><div class="foot">한국석유공사 오피넷 Open API 가격정보<br>실제 현장 판매가격과 차이가 있을 수 있습니다.</div></section><section id="repairView" class="hide"><div class="ctrl"><b>🛵 라이더 정비센터</b><div class="notice" style="margin-top:7px">실제로 방문 가능한 것으로 확인된 업체부터 등록합니다. 방문 전 전화로 PCX/NMAX 및 필요한 정비 가능 여부를 확인해주세요.</div></div><main id="repairList"></main><div class="foot">업체 정보는 변경될 수 있으므로 방문 전 전화 확인을 권장합니다.<br>애매하거나 방문 여부가 불확실한 업체는 등록하지 않습니다.</div></section></div><script>let area='both';const L=document.querySelector('#list'),S=document.querySelector('#status'),F=document.querySelector('#fuel'),fuelView=document.querySelector('#fuelView'),repairView=document.querySelector('#repairView'),fuelTab=document.querySelector('#fuelTab'),repairTab=document.querySelector('#repairTab'),heroTitle=document.querySelector('#heroTitle'),heroSub=document.querySelector('#heroSub');const repairs=[{name:'명진종합오토바이',district:'마포구',address:'서울 마포구 만리재로 132-2',phone:'010-8542-6551',note:'동네형 이륜차 정비센터 · 방문 전 정비 가능 여부 전화 확인'},{name:'퇴계로모터스',district:'용산구',address:'서울 용산구 원효로1가 45-5',phone:'02-3273-8444',note:'이륜차 정비센터 · 방문 전 정비 가능 여부 전화 확인'},{name:'DM BIKE',district:'마포구',address:'서울 마포구 월드컵북로 49, 101호',phone:'',note:'모터사이클 정비/부품 · PCX/NMAX 정비 가능 여부 전화 확인 권장'}];const e=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function showFuel(){fuelView.classList.remove('hide');repairView.classList.add('hide');fuelTab.classList.add('on');repairTab.classList.remove('on');heroTitle.textContent='⛽ 용산·마포 최저가 주유소';heroSub.textContent='오피넷 가격정보 기준 · 라이더용 빠른 검색'}function showRepair(){fuelView.classList.add('hide');repairView.classList.remove('hide');repairTab.classList.add('on');fuelTab.classList.remove('on');heroTitle.textContent='🔧 용산·마포 오토바이 정비센터';heroSub.textContent='라이더가 실제 방문 가능한 정비센터 위주';renderRepairs()}fuelTab.onclick=showFuel;repairTab.onclick=showRepair;function renderRepairs(){document.querySelector('#repairList').innerHTML=repairs.map(x=>`<article class="card"><div class="tag">${e(x.district)}</div><div class="name">${e(x.name)}</div><div class="addr">📍 ${e(x.address)}<br>☎️ ${x.phone?e(x.phone):'전화번호 확인 필요'}<br>🔧 ${e(x.note)}</div><div class="actions">${x.phone?`<a class="call" href="tel:${x.phone.replace(/-/g,'')}">전화하기</a>`:''}<a target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent(x.name+' '+x.address)}">네이버지도</a><a target="_blank" href="https://map.kakao.com/link/search/${encodeURIComponent(x.name+' '+x.address)}">카카오맵</a></div></article>`).join('')}document.querySelectorAll('#areas button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#areas button').forEach(x=>x.classList.remove('on'));b.classList.add('on');area=b.dataset.a;load()});F.onchange=load;document.querySelector('#refresh').onclick=load;async function load(){L.innerHTML='<div class="empty">최신 가격 확인 중...</div>';try{const r=await fetch('/api/stations?area='+area+'&prodcd='+F.value,{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error||'조회 실패');if(!d.stations.length)throw Error('검색 결과가 없습니다.');const min=d.stations[0].price;L.innerHTML=d.stations.map((x,i)=>`<article class="card ${x.price===min?'best':''}"><div class="top"><div><div class="rank">${i+1}위 · ${e(x.district)}</div><div class="name">${e(x.name)}</div></div><div class="price">${x.price.toLocaleString()}<small>원/L</small></div></div><div class="addr">${x.price===min?'🏆 최저가 · ':''}${e(x.address)}</div><div class="actions"><a target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent(x.name+' '+x.address)}">네이버지도</a><a target="_blank" href="https://map.kakao.com/link/search/${encodeURIComponent(x.name+' '+x.address)}">카카오맵</a></div></article>`).join('');S.textContent=new Date(d.updatedAt).toLocaleString('ko-KR')+' 조회 · '+d.stations.length+'곳 · 가격순'}catch(err){L.innerHTML='<div class="empty"><b>가격 조회 연결 오류</b><br><br>'+e(err.message)+'</div>';S.textContent='연결 확인 필요'}}load()</script></body></html>
